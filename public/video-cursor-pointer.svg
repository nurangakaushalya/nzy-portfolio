<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <defs>
    <filter id="cursor-hover-shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <g filter="url(#cursor-hover-shadow)">
    <!-- Main Camera Body in Brand Orange -->
    <rect x="1.5" y="1.5" width="16" height="13" rx="2.5" fill="#FF6A00" stroke="#000000" stroke-width="1.5"/>
    <!-- Camera Lens Cone -->
    <path d="M18.5 5.5L25 2.5V13.5L18.5 10.5V5.5Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Play Triangle Inside Camera -->
    <polygon points="7.5,4.5 7.5,11.5 13.5,8" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
  </g>
</svg>
