<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <defs>
    <filter id="cursor-shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>
  <g filter="url(#cursor-shadow)">
    <!-- Main Camera Body -->
    <rect x="1.5" y="1.5" width="16" height="13" rx="2.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <!-- Camera Lens Cone -->
    <path d="M18.5 5.5L25 2.5V13.5L18.5 10.5V5.5Z" fill="#FF6A00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Tape / Reel indicators -->
    <circle cx="6" cy="6" r="1.5" fill="#FF6A00"/>
    <circle cx="10.5" cy="6" r="1.5" fill="#111111"/>
    <!-- Lens highlight -->
    <circle cx="21" cy="8" r="0.8" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
