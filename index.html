<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nzy — Video Editing &amp; Graphic Design</title>
    <meta
      name="description"
      content="Nzy is a creative studio portfolio showcasing video editing, commercial films, motion graphics, and graphic design."
    />
    <meta property="og:title" content="Nzy — Video Editing & Graphic Design" />
    <meta
      property="og:description"
      content="Nzy is a creative studio portfolio showcasing video editing, commercial films, motion graphics, and graphic design."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      #site-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s ease-out;
      }
      #site-preloader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes preloader-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .preloader-label {
        margin-top: 1.25rem;
        font-family: 'Outfit', -apple-system, sans-serif;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #ffffff;
        animation: preloader-pulse 1.8s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-black text-white antialiased selection:bg-[#FF6A00] selection:text-black">
    <!-- Preloader shown immediately during initial site load or page refresh -->
    <div id="site-preloader" aria-label="Loading site">
      <div style="display:flex;flex-direction:column;align-items:center;padding:1.5rem;text-align:center;">
        <img
          src="/loader.gif"
          alt="Loading animation"
          width="320"
          height="180"
          style="width:300px;max-width:85vw;height:auto;aspect-ratio:16/9;border-radius:14px;object-fit:cover;box-shadow:0 0 40px rgba(255,106,0,0.22);border:1px solid rgba(255,255,255,0.12);"
        />
        <div class="preloader-label">Loading...</div>
      </div>
    </div>

    <div id="root"></div>
    <script>
      // Fallback: Ensure loader dismisses automatically even if network stalls
      setTimeout(function() {
        var el = document.getElementById('site-preloader');
        if (el && !el.classList.contains('fade-out')) {
          el.classList.add('fade-out');
          setTimeout(function() { if (el && el.parentNode) el.parentNode.removeChild(el); }, 500);
        }
      }, 4000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
